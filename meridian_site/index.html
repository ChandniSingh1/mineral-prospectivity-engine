<meta charset="utf-8">
<title>MERIDIAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Outfit:wght@200;300;400;500&display=swap">
<style>
/* Opening screen, then the working map. One stage, one camera, so Enter is a camera move and not a page change. */
:root{--bg:#08090b;--ink:#f6f1e2;--soft:#d4d2ca;--mute:#8d8f94;--line:rgba(255,255,255,.12);--gold:#f2c14e;--ui:'Montserrat',Verdana,sans-serif;--tx:'Outfit',Verdana,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--ui)}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;margin:-450px 0 0 -720px;transform:scale(var(--s,1));overflow:hidden;background:#0a0b0e;user-select:none;-webkit-user-select:none}
#grid{position:absolute;inset:0;opacity:1;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:90px 90px,90px 90px;transition:opacity 1.6s ease}
#map{position:absolute;left:447.6px;top:40px;width:549.9px;height:846.9px;transition:opacity .5s ease}
#halo{position:absolute;left:380px;top:20px;width:680px;height:860px;background:radial-gradient(ellipse at 50% 48%,rgba(150,185,225,.06),rgba(150,185,225,0) 62%);pointer-events:none;transition:opacity 1s ease}
#mc{position:absolute;left:0;top:0;width:1440px;height:900px;opacity:0;touch-action:none;cursor:grab}
#mc.drag{cursor:grabbing}
#cam{position:absolute;inset:0;transition:opacity .9s ease;pointer-events:none}
svg#dots{position:absolute;inset:0}
.mn circle{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2)}
.mn.on circle{animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.mn .gl circle{opacity:0}.mn.on .gl circle{animation-name:popg}
@keyframes popg{to{opacity:.24;transform:scale(1)}}
.pl{position:absolute;display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:#d9d6cc;opacity:0;transition:opacity 1.2s ease;transition-delay:var(--d);white-space:nowrap;text-shadow:0 0 6px rgba(8,9,11,.95),0 0 14px rgba(8,9,11,.9)}
.pl.on{opacity:.9}
.pl i{width:5px;height:5px;border:1px solid #f6f1e2;border-radius:50%;flex:none}
.pl.l{transform:translate(calc(-100% + 3px),-50%);flex-direction:row-reverse}
.pl.r{transform:translate(-3px,-50%)}
#hx,#vx{position:absolute;background:rgba(242,193,78,.85);box-shadow:0 0 10px rgba(242,193,78,.55);opacity:0}
#hx{left:0;right:0;top:314.5px;height:1px;transform:scaleX(0);transform-origin:815.6px 0}
#vx{top:0;bottom:0;left:815.6px;width:1px;transform:scaleY(0);transform-origin:0 314.5px}
#hx.on{opacity:1;transform:none;transition:transform 2.2s cubic-bezier(.4,0,.1,1),opacity .4s ease}
#vx.on{opacity:1;transform:none;transition:transform 2.2s cubic-bezier(.4,0,.1,1) .1s,opacity .4s ease .1s}
#mk{position:absolute;left:815.6px;top:314.5px;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:1.5px solid #ffd877;background:rgba(242,193,78,.25);box-shadow:0 0 12px 2px rgba(242,193,78,.4);opacity:0;transform:scale(2.4);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
#mk.on{opacity:1;transform:none}
#ring{position:absolute;left:815.6px;top:314.5px;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:1px solid rgba(255,216,119,.8);border-radius:50%;opacity:0}
#ring.on{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(9)}}
#rd{font-family:var(--mono);position:absolute;left:calc(815.6px + 16px);top:calc(314.5px + 12px);font-size:9.5px;letter-spacing:.2em;color:#f2e2b6;opacity:0;transition:opacity 1s ease .5s;white-space:nowrap;text-shadow:0 0 8px rgba(8,9,11,.9)}
#rd.on{opacity:.95}
#rule{position:absolute;inset:0;pointer-events:none;transition:opacity .8s ease}
#rule text{font-family:var(--ui);font-size:9px;letter-spacing:.18em;fill:#6f7278}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(8,9,11,0) 55%,rgba(8,9,11,.65) 100%);transition:opacity 1.2s ease}
#veil{position:absolute;inset:0;background:radial-gradient(ellipse 50% 30% at 50% 50%,rgba(8,9,11,.86) 0%,rgba(8,9,11,.5) 62%,rgba(8,9,11,0) 100%);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
#veil.on{opacity:1}
#stage.titled .pl{opacity:.22!important;transition:opacity 1.4s ease}
#name{position:absolute;left:0;right:0;top:394px;text-align:center;font-weight:200;font-size:84px;line-height:1;letter-spacing:.5em;padding-left:.5em;color:var(--ink);text-shadow:0 0 12px rgba(255,255,255,.07);transition:opacity .7s ease}
#name span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(8px);transition:opacity 1.3s ease,transform 1.5s cubic-bezier(.16,.8,.24,1),filter 1.3s ease;transition-delay:var(--d)}
#name.on span{opacity:1;transform:none;filter:blur(0)}
#sub{position:absolute;left:0;right:0;top:510px;text-align:center;font-size:12px;font-weight:300;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:var(--soft);opacity:0;transform:translateY(8px);transition:opacity 1.5s ease,transform 1.5s ease}
#sub.on{opacity:.92;transform:none}
#end{position:absolute;left:0;right:0;top:572px;display:flex;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
#end.on{opacity:1;transform:none;pointer-events:auto}
#enter{font-family:var(--ui);font-weight:400;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);height:44px;padding:0 30px 0 34px;border-radius:22px;background:rgba(14,16,20,.7);border:1px solid rgba(242,193,78,.7);cursor:pointer;transition:background .25s,box-shadow .25s}
#enter:hover,#enter:focus-visible{background:rgba(242,193,78,.14);box-shadow:0 0 28px rgba(242,193,78,.25);outline:none}
#legend{position:absolute;left:0;right:0;top:664px;display:flex;justify-content:center;gap:48px;transition:opacity .6s ease}
.lg{font-size:10.5px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease;text-shadow:0 0 10px #08090b,0 0 4px #08090b,0 0 18px currentColor}
.lg.on{opacity:1;transform:none}
#skip{position:absolute;right:56px;bottom:44px;font-family:var(--ui);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);background:none;border:0;cursor:pointer;opacity:0;transition:opacity 1.2s ease}
#skip.on{opacity:1}#skip:hover{color:var(--ink)}
.fade{opacity:0!important;pointer-events:none!important}
.instant,.instant *{transition:none!important;animation-duration:0s!important}

/* ---------- the working map ---------- */
#ui{position:absolute;inset:0;pointer-events:none;font-family:var(--tx);opacity:0;transition:opacity 1s ease}
#ui.on{opacity:1}
#ui>*{pointer-events:auto}
#haze{position:absolute;inset:0;pointer-events:none!important;background:linear-gradient(180deg,rgba(8,9,11,.72) 0%,rgba(8,9,11,0) 20%,rgba(8,9,11,0) 82%,rgba(8,9,11,.6) 100%)}
.glass{background:rgba(14,16,20,.62);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
#brand{position:absolute;left:48px;top:30px;font-family:var(--ui);font-weight:200;font-size:20px;letter-spacing:.5em;color:var(--ink);cursor:default}
#search{position:absolute;left:50%;top:22px;margin-left:-240px;width:480px;height:40px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;box-sizing:border-box}
#search svg{flex:none}
#q{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#ece8dc;font-family:var(--tx);font-weight:300;font-size:13.5px}
#q::placeholder{color:#7d8087}
#dtm{flex:none;height:28px;border-radius:14px;padding:0 11px;border:1px solid rgba(255,255,255,.14);background:none;color:#cfcbbd;font-family:var(--mono);font-size:10px;letter-spacing:.12em;cursor:pointer}
#dtm:hover{border-color:rgba(242,193,78,.6)}
#go{flex:none;height:28px;width:28px;border-radius:14px;border:0;background:#f2c14e;color:#17130a;cursor:pointer;display:flex;align-items:center;justify-content:center}
#qerr{position:absolute;left:50%;top:68px;margin-left:-240px;width:480px;font-size:12px;font-weight:300;color:#ff8a3d;text-align:center;opacity:0;transition:opacity .3s}
#qerr.on{opacity:1}
#pills{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:22px}
.pill{height:30px;padding:0 15px;border-radius:15px;border:0;background:none;color:#a9a79d;font-family:var(--tx);font-size:13px;font-weight:400;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .2s,color .2s}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill:hover{color:#f0ece0}
.pill.on{background:rgba(255,255,255,.12);color:#f6f1e2}
#side{position:absolute;left:48px;top:134px;width:300px;box-sizing:border-box;padding:20px 22px 18px;border-radius:16px;background:rgba(14,16,20,.72)}
#side h2{margin:0;font-weight:400;font-size:17px;color:#f6f1e2;display:flex;align-items:center;gap:10px}
#side h2 i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
#side p{margin:10px 0 0;font-weight:300;font-size:12.5px;line-height:1.5;color:#9a9ca1}
#sleg{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.lrow{display:flex;align-items:center;gap:12px;height:24px;font-size:12px;color:#d4d2ca;font-weight:300}
.lrow b{width:14px;height:14px;border-radius:3px;flex:none}
.lrow span{width:14px;color:#f0ece0;font-weight:400}
.lrow em{font-style:normal;color:#9a9ca1}
#hint{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;font-weight:300;line-height:1.45;color:#8d8f94}
#cardw{position:absolute;right:48px;top:70px;width:350px;max-height:800px;overflow:auto;border-radius:16px;opacity:0;transform:translateX(18px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
#cardw::-webkit-scrollbar{display:none}
#cardw.on{opacity:1;transform:none}
#note{position:absolute;right:48px;top:70px;width:350px;box-sizing:border-box;padding:18px 22px;border-radius:16px;opacity:0;transition:opacity .4s ease;font-size:13px;font-weight:300;line-height:1.5;color:#d4d2ca;pointer-events:none}
#note.on{opacity:1;pointer-events:auto}
#note b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;font-weight:400;color:#8d8f94;text-transform:uppercase;margin-bottom:8px}
#zoom{position:absolute;right:420px;bottom:60px;display:flex;flex-direction:column;gap:8px}
#zoom button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(14,16,20,.7);color:#e8e4d6;font-family:var(--tx);font-size:19px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
#zoom button:hover{border-color:rgba(242,193,78,.6);background:rgba(30,32,38,.8)}
#hov{position:absolute;left:48px;bottom:44px;height:34px;padding:0 14px;border-radius:17px;display:none;align-items:center;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#b9b7ad;min-width:200px;box-sizing:border-box}
#hov b{font-weight:400;color:#f6f1e2}
#mine{position:absolute;right:48px;top:22px;height:38px;padding:0 16px;border-radius:19px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--tx);font-size:12.5px;color:#ece8dc;border:1px solid rgba(255,255,255,.10)}
#mine:hover{color:#fff;border-color:rgba(242,193,78,.5)}
#mine i{font-style:normal;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#e0157a;color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center}
.ovl{position:absolute;box-sizing:border-box;border-radius:16px;background:#0e1014;border:1px solid rgba(255,255,255,.13);box-shadow:0 20px 60px rgba(0,0,0,.65);color:#d4d2ca;font-size:12px;font-weight:300;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .3s;z-index:70}
#ui>.ovl{pointer-events:none}
#ui>.ovl.on{opacity:1;pointer-events:auto;transform:none}
#ui>#tray:not(.on){pointer-events:none}
.ovl .ey{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:#8d8f94;text-transform:uppercase}
.ovl button,.ovl select{font-family:var(--tx);font-size:12px;color:#ece8dc;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;height:30px;padding:0 11px;cursor:pointer}
.ovl button:hover{border-color:rgba(242,193,78,.55)}
.ovl button.pr{background:#f2c14e;color:#17130a;border-color:#f2c14e;font-weight:500}
.ovl input[type=text]{width:100%;box-sizing:border-box;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#f0ece0;font-family:var(--tx);font-size:12.5px;padding:0 10px}
.ovl .x{position:absolute;right:14px;top:12px;width:28px;height:28px;padding:0;border-radius:14px;font-size:16px;line-height:1}
#path{position:absolute;left:48px;top:72px;display:flex;align-items:center;gap:2px;padding:3px 6px;border-radius:17px;background:rgba(14,16,20,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);font-family:var(--tx);font-size:11.5px}
#path button{height:26px;padding:0 10px;border-radius:13px;border:1px solid transparent;background:none;color:#9a9ca1;font-family:var(--tx);font-size:11.5px;cursor:pointer;white-space:nowrap}
#path button:hover{color:#f0ece0}
#path button.on{color:#f6f1e2;border-color:rgba(242,193,78,.55);background:rgba(14,16,20,.6)}
#path span{color:#5a5d63;font-size:11px}
#impp{left:50%;top:96px;width:820px;margin-left:-410px;padding:24px 28px 22px;max-height:790px;overflow:auto;scrollbar-width:thin}
#impp button{white-space:nowrap}
#impp textarea{width:100%;box-sizing:border-box;height:230px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#f0ece0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;padding:10px 12px;resize:vertical}
.ir{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
#valp{left:48px;right:48px;top:112px;padding:28px 34px 30px}
#crp{left:48px;right:48px;top:112px;bottom:48px;overflow:auto;padding:28px 34px;scrollbar-width:thin}
.vr{display:grid;grid-template-columns:130px repeat(7,1fr);gap:6px;align-items:center}
.vr span{text-align:center}
.cr{display:grid;grid-template-columns:330px 1fr 190px 130px;gap:18px;align-items:start;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.pill2{height:20px;padding:0 9px;border-radius:10px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.16em}
#tray{position:absolute;left:258px;width:716px;bottom:36px;height:56px;box-sizing:border-box;padding:0 12px;border-radius:16px;display:none;align-items:center;gap:6px}
#tray.on{display:flex}
#tray .tc{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 4px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);cursor:pointer;font-family:var(--mono);font-size:10px;color:#d4d2ca;white-space:nowrap}
#tray .tc:hover{border-color:rgba(242,193,78,.5)}
#tray #tray .tc{gap:6px}
#tray .tc u{text-decoration:none;color:#8d8f94;font-size:14px;padding:0 3px;cursor:pointer}
#tray .tc u:hover{color:#fff}
.gt{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;border:1.5px solid;font-size:13px;font-weight:600;flex:none}
#cmp{left:48px;right:48px;top:70px;max-height:800px;overflow:auto;padding:20px 26px 18px;scrollbar-width:thin}
#minep{right:48px;top:70px;width:430px;max-height:800px;overflow:auto;padding:20px 22px;scrollbar-width:thin;z-index:66}
#savep{left:690px;bottom:112px;width:330px;padding:16px 18px;z-index:72}
#savep.mid{left:50%;margin-left:-165px;bottom:auto;top:300px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.65)}
#cmp .gr{display:grid;gap:0 14px;align-items:center}
#cmp .rl{padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
.mi{padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}

[data-src]{cursor:help;border-radius:5px;transition:background .15s}
@media (hover:hover){[data-src]:hover{background:rgba(255,255,255,.05)}}
[data-src].pin{background:rgba(255,255,255,.05)}
[data-src] b{border-bottom:1px dotted rgba(246,241,226,.35)}
#srcpop{position:absolute;width:300px;box-sizing:border-box;padding:14px 16px;border-radius:12px;background:rgba(16,18,23,.97);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 44px rgba(0,0,0,.6);font-size:12px;line-height:1.45;color:#d4d2ca;font-weight:300;opacity:0;pointer-events:none;transform:translateX(6px);transition:opacity .18s,transform .18s;z-index:60}
#srcpop.on{opacity:1;transform:none}
#srcpop .ey{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:#8d8f94;text-transform:uppercase;margin-bottom:8px}
#srcpop h4{margin:0 0 4px;font-weight:500;font-size:12.5px;color:#f0ece0}
#srcpop .tb{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:11.5px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;margin-top:10px}
#srcpop .tb span:nth-child(odd){color:#9a9ca1}#srcpop .tb span:nth-child(even){color:#f0ece0;font-family:var(--mono);font-size:11px}
#srcpop .nt{margin-top:10px;color:#8d8f94;font-size:11px}
#aboutb{position:absolute;right:170px;top:25px;height:32px;padding:0 15px;border-radius:16px;font-family:var(--tx);font-size:12px;color:#d4d2ca;cursor:pointer;border:1px solid rgba(255,255,255,.10)}
#narrow{display:none}@media (max-width:820px){#narrow{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:10px 14px;border-radius:12px;background:rgba(14,16,20,.92);color:#d4d2ca;font:12px/1.4 system-ui,sans-serif;border:1px solid rgba(255,255,255,.12)}}
#aboutb:hover{color:#f6f1e2}
#about{position:absolute;left:48px;bottom:134px;width:330px;box-sizing:border-box;padding:16px 18px;border-radius:14px;background:rgba(16,18,23,.97);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 44px rgba(0,0,0,.6);font-size:12px;line-height:1.5;color:#d4d2ca;font-weight:300;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .22s,transform .22s;z-index:55}
#about.on{opacity:1;pointer-events:auto;transform:none}
#about .ey{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:#8d8f94;text-transform:uppercase;margin-bottom:8px}
#about h3{margin:0 0 8px;font-weight:400;font-size:14px;color:#f0ece0}
#about .it{padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}#about .it b{font-weight:500;color:#f0ece0}
#toast{position:absolute;left:50%;bottom:108px;transform:translate(-50%,10px);height:36px;padding:0 18px;border-radius:18px;display:flex;align-items:center;font-size:12.5px;font-weight:300;color:#ece8dc;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:var(--tx);font-weight:300;font-size:12px;letter-spacing:.16em;color:#8d8f94;opacity:0;transition:opacity .4s;pointer-events:none}
#load.on{opacity:1}
</style>
<div id="stage" aria-label="MERIDIAN">
<div id="grid"></div>
<div id="halo"></div>
<img id="map" src="terrain.webp" alt="Relief map of Guyana from above">

  if(!(la>=-90&&la<=90&&lo>=-180&&lo<=180))throw bad;
  if(datum==='PSAD56'){var w=psad2wgs(la,lo);la=w[0];lo=w[1]}
  return [la,lo]}
function nearLand(r,c){if(!landMask)return true;for(var dr=-30;dr<=30;dr+=2)for(var dc=-30;dc<=30;dc+=2){var rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<META.NY&&cc<META.NX&&landMask[rr*META.NX+cc])return true}return false}
function goTo(text){var err=$('qerr');err.classList.remove('on');
  var ll;try{ll=parseCoord(text)}catch(e){err.textContent=e;err.classList.add('on');return}
  var r=Math.floor(+((META.N0-ll[0])/META.res).toFixed(7)),c=Math.floor(+((ll[1]-META.W0)/META.res).toFixed(7)),i=D.cell(r,c);
  if(i<0&&!nearLand(r,c)){err.textContent=META.wording.coord_outside;err.classList.add('on');return}
  select([r,c]);flyTo(r,c,i<0?6:13);}

/* ---------- pointer ---------- */
function stagePt(e){var r=st.getBoundingClientRect();return [(e.clientX-r.left)/r.width*1440,(e.clientY-r.top)/r.height*900]}
var drag=null;
cv.addEventListener('pointerdown',function(e){if(mode!=='map')return;cv.setPointerCapture(e.pointerId);var p=stagePt(e);drag={x:p[0],y:p[1],cx:cam.cx,cy:cam.cy,moved:false};});
cv.addEventListener('pointermove',function(e){if(mode!=='map'||!D)return;var p=stagePt(e);
  if(drag){var dx=p[0]-drag.x,dy=p[1]-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;cv.classList.add('drag')}if(drag.moved){cam.cx=drag.cx-dx/cam.k;cam.cy=drag.cy-dy/cam.k;clampCam();draw()}}
  var w=s2w(p[0],p[1]),rc=cellAtW(w[0],w[1]),i=D.cell(rc[0],rc[1]);
  if(i!==hover){hover=i;draw()}
  var ll=w2lonlat(w[0],w[1]),g='';
  if(i>=0&&mineral==='all'){var bg=9,bm='';['gold','bauxite','manganese'].forEach(function(k){var gg=D.c['g_'+MKEY[k]][i];if(gg<bg){bg=gg;bm=k}});g=' &nbsp;<b>'+bm+' '+'ABCDEF'[bg]+'</b>'}
  else if(i>=0&&mineral!=='diamond')g=' &nbsp;<b>Grade '+'ABCDEF'[D.c['g_'+MKEY[mineral]][i]]+'</b>';
  else if(i>=0)g=' &nbsp;<b>Diamond-like tint</b>';
  $('hov').style.display='flex';$('hov').innerHTML='<span>'+MC.coord(ll[1],ll[0])+'</span>'+g;});
cv.addEventListener('pointerleave',function(){$('hov').style.display='none'});
cv.addEventListener('pointerup',function(e){if(mode!=='map')return;cv.classList.remove('drag');var was=drag;drag=null;if(was&&!was.moved){var p=stagePt(e),w=s2w(p[0],p[1]);var ph=D&&pinHit(p[0],p[1]);if(ph){if(ph.kind==='cluster'){var wc=s2w(ph.x,ph.y);tween({k:Math.min(48,cam.k*3),cx:wc[0],cy:wc[1]},700);return}var pi=ph.kind==='mine'?ph.s.i:ph.i;if(ph.kind==='mine'&&mineral!=='all'&&mineral!==ph.s.m)setMineral(ph.s.m);select([D.c.rr[pi],D.c.cc[pi]]);if(ph.kind==='mine')toast('Your note: '+ph.s.note);return}var rc=cellAtW(w[0],w[1]);if(rc[0]>=0&&rc[1]>=0&&rc[0]<META.NY&&rc[1]<META.NX){select(rc)}}});
cv.addEventListener('wheel',function(e){if(mode!=='map')return;e.preventDefault();var p=stagePt(e),w0=s2w(p[0],p[1]);cam.k*=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016));cam.k=Math.max(1,Math.min(48,cam.k));
  cam.cx=w0[0]-(p[0]-720)/cam.k;cam.cy=w0[1]-(p[1]-450)/cam.k;clampCam();draw()},{passive:false});
cv.addEventListener('dblclick',function(e){if(mode!=='map')return;var p=stagePt(e),w=s2w(p[0],p[1]);tween({k:Math.min(48,cam.k*2.2),cx:w[0],cy:w[1]},500)});
function zoomBy(f){var t={k:Math.max(1,Math.min(48,cam.k*f)),cx:cam.cx,cy:cam.cy};tween(t,350)}
$('zi').addEventListener('click',function(){zoomBy(1.8)});$('zo').addEventListener('click',function(){zoomBy(1/1.8)});
$('zh').addEventListener('click',function(){tween(blockTarget(),900)});
$('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(b)setMineral(b.getAttribute('data-m'))});
$('search').addEventListener('submit',function(e){e.preventDefault();if(D)goTo($('q').value)});
$('dtm').addEventListener('click',function(){datum=datum==='WGS84'?'PSAD56':'WGS84';$('dtm').textContent=datum;var n=$('qerr');if(datum==='PSAD56'){n.style.color='#9a9ca1';n.textContent=META.datum.permit_label+'. Use this for coordinates copied from a permit notice.';n.classList.add('on');setTimeout(function(){n.classList.remove('on');n.style.color=''},3200)}else n.classList.remove('on')});
$('cardw').addEventListener('click',function(e){var go=e.target.closest('[data-goto]');if(go){setMineral(go.getAttribute('data-goto'));return}
  var a=e.target.closest('[data-alert]');if(a){var k=+a.getAttribute('data-alert');openAlert=(openAlert===k?-1:k);var sc=$('cardw').scrollTop;showCard();$('cardw').scrollTop=sc;return}
  var b=e.target.closest('[data-act]');if(b&&sel&&sel.i>=0){if(b.getAttribute('data-act')==='add')openSave(sel.i,cm());else addCmp(sel.i)}});
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}
addEventListener('keydown',function(e){if(mode==='map'){if(e.key==='Escape'){sel=null;$('cardw').classList.remove('on');$('note').classList.remove('on');draw()}return}
  if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();enter()}});
st.addEventListener('click',function(e){if(mode!=='intro'||left||e.target.id==='enter')return;if($('end').classList.contains('on'))return;enter()});
$('enter').addEventListener('click',enter);
$('skip').addEventListener('click',function(e){e.stopPropagation();enter()});
addEventListener('resize',fit);
fit();play();
})();
</script>
